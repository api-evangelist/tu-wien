x-coverage:
  state: covered
  reason: covered
  detail: >-
    TU Wien has eight institution-operated machine surfaces and one tenant relationship, all probed
    live on 2026-08-30. Three read anonymously (the InvenioRDM REST API and both OAI-PMH endpoints),
    one is deployed but crawler-blocked (the DSpace REST layer), one is behind institutional SSO
    with a live but undocumented edge (TISS), one is token-gated with a public contract (FUNDify),
    and two are pure identity metadata (the RIS Synergy OIDC realm and the SAML IdP). Exactly one
    OpenAPI exists and it is TU Wien's own; no vendor contract is saved here. What is genuinely
    absent is central: no developer portal, no API key issuance, no status page, no changelog, no
    deprecation policy, no open-data portal (data.tuwien.ac.at does not resolve), and no llms.txt.
  evidence:
    - url: https://researchdata.tuwien.ac.at/api/records?size=1
      status: 200
    - url: https://researchdata.tuwien.ac.at/oai2d?verb=ListMetadataFormats
      status: 200
    - url: https://repositum.tuwien.at/oai/openaire?verb=Identify
      status: 200
    - url: https://repositum.tuwien.at/server/api/core/items?size=1
      status: 416
    - url: https://repositum.tuwien.at/oai/request?verb=Identify
      status: 500
    - url: https://tiss.tuwien.ac.at/api/course/v22/all
      status: 404
    - url: https://tiss.tuwien.ac.at/api/dokumentation
      status: 200
    - url: https://fundify.arisnet.ac.at/api/ris-synergy/funding/v1/fundings
      status: 401
    - url: https://ris-synergy.csd.tuwien.ac.at/auth/realms/ris-synergy/.well-known/openid-configuration
      status: 200
    - url: https://eduid.at/md/aconet-registered.xml
      status: 200
    - url: https://www.tuwien.at/llms.txt
      status: 404
    - url: https://researchdata.tuwien.ac.at/.well-known/openid-configuration
      status: 404
