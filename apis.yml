    name: FUNDify — RIS Synergy Funding API
    x-operator: institution
    x-operator-evidence: >-
      The OpenAPI and the implementation live in TU Wien's own GitHub organisation
      (github.com/tuwien-csd/fundify, EUPL-1.2) under the Java package at.ac.tuwien.fundify, written
      by TU Wien Campus Software Development. The national instance runs for the ARISnet consortium
      at fundify.arisnet.ac.at; TU Wien led the RIS Synergy project that defined the standard.
    description: >-
      TU Wien's own OpenAPI-described contract, and the only one in this repository. FUNDify
      publishes Austrian funding programmes and calls and lets institutions annotate them for their
      own researchers, implementing the RIS Synergy national Funding endpoint. Four GET operations,
      32 object schemas. Anonymous calls return 401; the contract itself documents no 401 and no
      error body, which rules/tu-wien-spectral.yml flags.
    humanURL: https://github.com/tuwien-csd/fundify
