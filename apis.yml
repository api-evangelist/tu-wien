aid: tu-wien
name: TU Wien
x-type: university
x-category: Technical University
description: >-
  TU Wien (Vienna University of Technology) is Austria's largest science and technology university,
  founded in 1815, with more than 30,000 students across eight faculties. It operates no central
  developer portal, publishes no API key issuance page and offers no unified developer credential,
  and most of what looks like a TU Wien API is a product it bought rather than built. What it does
  operate is real and unusually varied for the cohort: a self-hosted InvenioRDM research-data
  repository whose REST API answers anonymously, two live OAI-PMH endpoints, a DSpace-CRIS
  institutional repository, the TISS student-information REST API (versioned, structured errors,
  documentation behind TU Wien SSO), a SAML 2.0 identity provider registered in the ACOnet/eduID.at
  federation and interfederated into eduGAIN, and — the one genuinely engineered contract — the
  FUNDify funding API, written and maintained by TU Wien Campus Software Development for the
  Austrian RIS Synergy network the university led. Its library discovery layer is a tenant surface
  on the OBVSG consortium's Ex Libris Primo platform, not TU Wien engineering. Conformance is
  concentrated in research infrastructure: OAI-PMH 2.0, DataCite, ORCID and SAML are all verified
  live; SCIM, LTI, OneRoster, Ed-Fi, Caliper and QTI are absent.
