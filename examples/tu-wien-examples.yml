  publish this file.
source: live HTTP probes run 2026-08-30 against each host, plus the FUNDify OpenAPI in openapi/_original/
note: >-
  Every example below was executed. The status code recorded is the status code returned.
  Examples marked `method: derived` were constructed from the contract and NOT executed, because the
