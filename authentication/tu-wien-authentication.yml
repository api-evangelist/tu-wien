    scheme: none for read, bearer for write
    detail: >-
      InvenioRDM. GET /api/records, /api/communities, /api/vocabularies/*, /api/affiliations and
      /api/funders answer anonymously. /api/names returns 403 anonymously. Write operations
      (drafts, file upload, curation requests) require a personal access token issued from the user
      account and sent as `Authorization: Bearer <token>`.
    evidence:
      - url: https://researchdata.tuwien.ac.at/api/records?size=1
        status: 200
      - url: https://researchdata.tuwien.ac.at/api/names?size=1
        status: 403
